name: Web Smoke

# The unit tests live in push.yml. This job guards the other half of boabro:
# the static PyScript pages under docs/. It serves them and confirms each one
# is reachable, so a broken or renamed example fails the build.

on:
  push:
    branches: [main]
    paths: ["docs/**"]
  pull_request:
    branches: [main]
    paths: ["docs/**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-smoke:
    name: Serve and reach docs pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Serve docs and probe pages
        run: |
          python3 -m http.server 8080 --directory docs &
          server_pid=$!
          sleep 2
          status=0
          for page in \
            pyscript-puepy-bootstrap.html \
            pyscript-puepy-bulma.html \
            gradio.html \
            stlite.html; do
            if curl -fsS "http://localhost:8080/$page" > /dev/null; then
              echo "ok   $page"
            else
              echo "FAIL $page"
              status=1
            fi
          done
          kill "$server_pid"
          exit $status
