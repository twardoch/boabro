name: Release

# Fires when a vX.Y.Z tag is pushed. hatch-vcs reads that tag for the version,
# so the wheel is stamped straight from git. Tests gate the publish; a clean
# build then goes to PyPI (trusted publishing) and a GitHub Release.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  test:
    name: Test before release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install UV
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Install dependencies
        run: uv pip install --system ".[dev,test]"

      - name: Lint and type-check
        run: |
          python -m ruff check src/boabro tests
          python -m ruff format --check src/boabro tests
          python -m mypy src/boabro tests

      - name: Run tests
        run: python -m pytest tests/ -p no:briefcase

  release:
    name: Publish to PyPI
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/boabro
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install UV
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Build distributions
        run: |
          uv pip install --system build hatchling hatch-vcs
          python -m build --outdir dist

      - name: Verify distribution files
        run: |
          ls -la dist/
          test -n "$(find dist -name '*.whl')" || (echo "Wheel missing" && exit 1)
          test -n "$(find dist -name '*.tar.gz')" || (echo "Source dist missing" && exit 1)

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## Install

            ```bash
            pip install boabro
            ```

            ## Use

            ```bash
            boabro font.ttf                       # text summary
            boabro font.ttf --format json -o a.json
            ```

            The browser inspector lives at
            <https://twardoch.github.io/boabro/>.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
